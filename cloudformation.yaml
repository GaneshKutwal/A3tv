AWSTemplateFormatVersion: '2010-09-09'
Description: >
  A3 Television Warranty & Complaint Hub — Full AWS Stack
  Resources: DynamoDB | S3 (storage + frontend) | Lambda (FastAPI + mangum)
  | API Gateway (REST) | CloudFront | IAM | CloudWatch Logs

# ─────────────────────────────────────────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────────────────────────────────────────
Parameters:

  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
    Description: Deployment environment tag

  LambdaCodeBucket:
    Type: String
    Description: >
      Name of the S3 bucket where your backend Lambda zip is uploaded.
      (Run deploy.ps1 to package and upload automatically.)

  LambdaCodeKey:
    Type: String
    Default: backend/lambda.zip
    Description: S3 object key of the Lambda zip file

  JWTSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      JWT signing secret - minimum 32 characters.
      Generate: python -c "import secrets; print(secrets.token_hex(32))"

  DynamoDBTableName:
    Type: String
    Default: WarrantyComplaintHub
    Description: DynamoDB table name

  LambdaMemoryMB:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048]
    Description: Lambda memory in MB

  LambdaTimeoutSeconds:
    Type: Number
    Default: 29
    MinValue: 10
    MaxValue: 29
    Description: Lambda timeout (max 29s for API Gateway integration)


# ─────────────────────────────────────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ===========================================================================
  # 1. DYNAMODB TABLE
  # ===========================================================================
  WarrantyComplaintTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: UserId
          AttributeType: S
        - AttributeName: CreatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: UserId
              KeyType: HASH
            - AttributeName: CreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: A3TV-WarrantyHub
        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 2. S3 BUCKET - File Storage (Invoices + Attachments)
  # ===========================================================================
  FileStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'a3tv-storage-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: A3TV-WarrantyHub
        - Key: Purpose
          Value: InvoicesAndAttachments
        - Key: Environment
          Value: !Ref Environment


